name: Publish

# Rules that triggers the workflows
on:
  release:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # needed for provenance data generation

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish-package.outputs.version }}
      dist_tag: ${{ steps.publish-package.outputs.dist_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm primitives:build

      - name: Build Schematics
        run: pnpm primitives:build:schematics

      - name: Publish package 📦
        id: publish-package
        run: |
          VERSION="$(node -p "require('./packages/primitives/package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            # Prerelease (e.g. 1.0.0-beta.0) -> publish under its identifier dist-tag (beta/rc/alpha),
            # never "latest", so `npm i @radix-ng/primitives` keeps resolving the stable release.
            TAG="$(printf '%s' "$VERSION" | sed -E 's/^[0-9.]+-([0-9A-Za-z]+).*/\1/')"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION under dist-tag: $TAG"
          npx nx release publish --tag "$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: true

  deploy-docs:
    name: Deploy documentation
    needs: publish
    if: >-
      ${{
        needs.publish.result == 'success' &&
        needs.publish.outputs.dist_tag == 'latest' &&
        startsWith(github.ref, 'refs/tags/') &&
        github.event.release.prerelease != true
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docs-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install Vercel CLI
        run: npm install --global vercel@67.0.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Storybook and Playground
        # vercel.json runs pnpm build-site once and collects dist/radix-site.
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check current npm latest before deployment
        id: latest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          CURRENT_LATEST="$(npm view @radix-ng/primitives@latest version --registry=https://registry.npmjs.org --prefer-online)"
          if [[ "$RELEASE_VERSION" != "$CURRENT_LATEST" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping documentation for $RELEASE_VERSION: npm latest is $CURRENT_LATEST."
            echo "Documentation deployment skipped: release $RELEASE_VERSION is not npm latest ($CURRENT_LATEST)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production artifact
        if: steps.latest.outputs.deploy == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
