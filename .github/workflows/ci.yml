name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every pinned suite and browser regression
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Linters run over the whole working tree (prettier/eslint/stylelint are not nx
      # targets), so no git history is needed — keep the default shallow checkout.
      - name: Checkout code repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup

      - name: Linters
        run: |
          pnpm run prettier
          pnpm run stylelint --max-warnings=0
          pnpm run eslint --max-warnings=0

  unit:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — nx-set-shas needs full history to derive the affected base SHA.
      - name: Checkout code repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Scope to the primitives library plus the SSR app's render specs (radix-storybook and the
      # deprecated radix-docs stay out). `affected` has no project allow-list (only --exclude), so
      # list the excluded projects explicitly.
      - name: Run unit tests
        run: npx nx affected -t test --exclude=radix-storybook,radix-docs,radix-ng

  builds:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — nx-set-shas needs full history to derive the affected base SHA.
      - name: Checkout code repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Scope to the primitives library plus the SSR app (radix-storybook is built separately;
      # radix-docs is deprecated and its build is broken). `affected` has no project allow-list, so
      # list the excluded projects explicitly. radix-ssr-testing is built so its AOT template
      # type-check catches drift against the primitives' public API (it imports them as a consumer).
      - name: Build and check public template types
        run: npx nx affected -t build build:schematics typecheck --exclude=radix-storybook,radix-docs,radix-ng

  skills:
    runs-on: ubuntu-latest
    steps:
      # Regenerates the bundle and diffs it against the working tree — no git history needed.
      - name: Checkout code repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup

      - name: Verify contributor setup
        run: |
          pnpm agents:test
          pnpm agents:check

      - name: Verify skills bundle is up to date
        run: |
          node --test tools/scripts/skills/*.test.mjs
          pnpm exec ngc -p apps/radix-storybook/tsconfig.agents.json
          pnpm skills:build
          if [ -n "$(git status --porcelain skills)" ]; then
            echo "::error::Skills bundle is out of date. Run 'pnpm skills:build' and commit the result."
            git -c core.pager=cat diff -- skills
            exit 1
          fi

  scope:
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.scope.outputs.suites }}
      floating: ${{ steps.scope.outputs.floating }}
      docs: ${{ steps.scope.outputs.docs }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - name: Verify affected selection
        run: |
          pnpm parity:typecheck
          node --test tools/playwright/*.test.ts
      - name: Select affected browser contracts
        id: scope
        env:
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: node tools/playwright/affected.ts

  comparisons:
    name: Pinned parity (${{ matrix.suite }})
    needs: scope
    if: ${{ needs.scope.outputs.suites != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.scope.outputs.suites) }}
    # Playwright supports the browser system dependencies on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Compare affected primitive with pinned Base UI
        run: pnpm test-parity ${{ matrix.suite }}
      - name: Publish comparison summary
        if: always()
        env:
          PARITY_SUITE: ${{ matrix.suite }}
        run: |
          report="dist/parity-testing/$PARITY_SUITE/results/summary.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: primitive-parity-${{ matrix.suite }}
          path: dist/parity-testing/${{ matrix.suite }}/results
          retention-days: 14

  browsers:
    name: Browser regressions (${{ matrix.project }})
    needs: scope
    if: ${{ needs.scope.outputs.browser == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - name: Check affected floating primitives and docs
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_FILES: ${{ needs.scope.outputs.floating }}
          RUN_DOCS: ${{ needs.scope.outputs.docs }}
        run: node tools/playwright/run-affected.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: primitive-browser-${{ matrix.project }}
          path: |
            apps/visual-regression/test-results
            apps/visual-regression/playwright-report
          retention-days: 14

  # Preserve a single required gate even when no browser contracts were affected.
  parity:
    if: ${{ always() }}
    needs: [scope, comparisons, browsers]
    runs-on: ubuntu-24.04
    steps:
      - name: On error
        if: ${{ needs.scope.result != 'success' || (needs.comparisons.result != 'success' && needs.comparisons.result != 'skipped') || (needs.browsers.result != 'success' && needs.browsers.result != 'skipped') }}
        run: exit 1

  summary:
    if: ${{ always() }}
    needs: [lint, unit, builds, skills, parity]
    runs-on: ubuntu-latest
    steps:
      - name: On error
        if: ${{ needs.builds.result != 'success' || needs.unit.result != 'success' || needs.lint.result != 'success' || needs.skills.result != 'success' || needs.parity.result != 'success' }}
        run: exit 1
